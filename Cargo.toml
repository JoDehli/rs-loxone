[workspace]
members = ["loxone-mock"]

[package]
name = "rs-loxone"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
cbc = "0.2.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rsa = "0.9.10"
rustls = "0.23.46"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5.8"
webpki-roots = "1.0.11"
x509-cert = "0.3.0"
zeroize = "1.9.1"

[dev-dependencies]
loxone-mock = { path = "loxone-mock" }
rcgen = "0.14.10"
rpassword = "7.5.4"
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros"] }

[[test]]
name = "live_gen1"
path = "tests/live/gen1_smoke.rs"
