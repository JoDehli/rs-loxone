[package]
name = "loxone-mock"
version = "0.1.0"
edition = "2024"
description = "Scripted mock Loxone Miniserver (HTTP + WebSocket) for tests. Not for production."
license = "MIT OR Apache-2.0"
repository = "https://github.com/JoDehli/rs-loxone"
readme = "README.md"
keywords = ["loxone", "miniserver", "mock", "testing"]
categories = ["development-tools::testing"]
include = [
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/fixtures/**",
]

[dependencies]
aes = "0.9.4"
base64 = "0.23.1"
cbc = "0.2.1"
hex = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
rsa = "0.9.10"
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tungstenite = "0.30.0"
rustls = "0.23.46"
