[package]
name = "rs-loxone"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Low-level async client for the Loxone Miniserver: login, state updates, commands, reconnects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/JoDehli/rs-loxone"
readme = "README.md"
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/src/**",
    "/tests/**",
]
keywords = ["loxone", "miniserver", "smart-home", "async", "tokio"]
categories = ["network-programming", "api-bindings"]

[features]
# The rs-loxone command line program (needs the password prompt library).
cli = ["dep:rpassword"]
# A scripted fake Miniserver for tests (src/mock). Only compiled when asked for.
mock = ["dep:tungstenite"]

[[bin]]
name = "rs-loxone"
path = "src/bin/rs-loxone.rs"
required-features = ["cli"]

[dependencies]
rpassword = { version = "7.5.4", optional = true }
tungstenite = { version = "0.30.0", optional = true }
aes = "0.9.4"
base64 = "0.23.1"
cbc = "0.2.1"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hex = "0.4.3"
hmac = "0.13.0"
percent-encoding = "2.3.2"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rsa = "0.9.10"
rustls = "0.23.46"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "time", "macros", "sync", "io-util"] }
tokio-tungstenite = { version = "0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
url = "2.5.8"
webpki-roots = "1.0.11"
x509-cert = "0.3.0"
zeroize = "1.9.1"

[dev-dependencies]
rcgen = "0.14.10"
tokio = { version = "1.54.1", features = ["test-util", "rt", "macros"] }

[[example]]
name = "flood_server"
required-features = ["mock"]

[[test]]
name = "live_gen1"
path = "tests/live/gen1_smoke.rs"

[[test]]
name = "live_token_store"
path = "tests/live/token_store.rs"

[[test]]
name = "live_preflight"
path = "tests/live/preflight.rs"
